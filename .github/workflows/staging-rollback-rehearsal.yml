name: Signed Main Candidate Ephemeral Rehearsal (NO DEPLOY)

on:
  workflow_run:
    workflows:
      - Candidate Publication - Signed GHCR (NO DEPLOY)
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: signed-main-candidate-ephemeral-rehearsal
  cancel-in-progress: false

env:
  REGISTRY_REPOSITORY: ghcr.io/botond1/3d-printer-slicer-api
  PUBLICATION_ARTIFACT_SUBDIR: signed-main-publication-artifact-${{ github.run_id }}-${{ github.run_attempt }}
  REHEARSAL_INPUT_SUBDIR: signed-main-rehearsal-input-${{ github.run_id }}-${{ github.run_attempt }}
  VERIFICATION_SUBDIR: signed-main-verification-${{ github.run_id }}-${{ github.run_attempt }}
  EVIDENCE_SUBDIR: signed-main-staging-evidence-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  preflight:
    name: Prove the exact successful main publication artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_sha: ${{ steps.upstream.outputs.candidate_sha }}
      publication_run_id: ${{ steps.upstream.outputs.publication_run_id }}
      publication_run_attempt: ${{ steps.upstream.outputs.publication_run_attempt }}
      publication_workflow_id: ${{ steps.upstream.outputs.publication_workflow_id }}
      publication_artifact_id: ${{ steps.artifact.outputs.publication_artifact_id }}
      publication_artifact_name: ${{ steps.artifact.outputs.publication_artifact_name }}
      publication_artifact_digest: ${{ steps.artifact.outputs.publication_artifact_digest }}
    steps:
      - name: Accept only the exact successful protected-main publication event
        id: upstream
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_PATH: ${{ github.event.workflow_run.path }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_run" ] || \
             [ "$EVENT_REPOSITORY" != "Botond1/3D-Printer-Slicer-API" ] || \
             [ "$UPSTREAM_NAME" != "Candidate Publication - Signed GHCR (NO DEPLOY)" ] || \
             [ "$UPSTREAM_PATH" != ".github/workflows/candidate-publication.yml" ] || \
             [ "$UPSTREAM_EVENT" != "workflow_dispatch" ] || \
             [ "$UPSTREAM_CONCLUSION" != "success" ] || \
             [ "$UPSTREAM_BRANCH" != "main" ] || \
             [ "$UPSTREAM_REPOSITORY" != "$EVENT_REPOSITORY" ] || \
             [[ ! "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [[ ! "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ ]] || \
             [[ ! "$UPSTREAM_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || \
             [[ ! "$UPSTREAM_WORKFLOW_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Publication workflow_run identity is outside the rehearsal contract." >&2
            exit 2
          fi
          {
            echo "candidate_sha=$UPSTREAM_SHA"
            echo "publication_run_id=$UPSTREAM_RUN_ID"
            echo "publication_run_attempt=$UPSTREAM_RUN_ATTEMPT"
            echo "publication_workflow_id=$UPSTREAM_WORKFLOW_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the exact published main candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.upstream.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-prove the immutable upstream run through the GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ steps.upstream.outputs.candidate_sha }}
          PUBLICATION_RUN_ID: ${{ steps.upstream.outputs.publication_run_id }}
          PUBLICATION_RUN_ATTEMPT: ${{ steps.upstream.outputs.publication_run_attempt }}
          PUBLICATION_WORKFLOW_ID: ${{ steps.upstream.outputs.publication_workflow_id }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" ]
          git fetch --no-tags --depth=1 origin refs/heads/main
          main_sha="$(git rev-parse FETCH_HEAD)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$CANDIDATE_SHA" "$main_sha"
          run_file="$RUNNER_TEMP/publication-run-$PUBLICATION_RUN_ID.json"
          if [ -e "$run_file" ] || [ -L "$run_file" ]; then exit 2; fi
          umask 077
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLICATION_RUN_ID" > "$run_file"
          [ -f "$run_file" ] && [ ! -L "$run_file" ]
          [ "$(stat -c '%s' "$run_file")" -gt 0 ]
          [ "$(stat -c '%s' "$run_file")" -le 262144 ]
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$CANDIDATE_SHA" \
            --arg run "$PUBLICATION_RUN_ID" \
            --arg attempt "$PUBLICATION_RUN_ATTEMPT" \
            --arg workflow "$PUBLICATION_WORKFLOW_ID" '
              (.id | tostring) == $run and
              (.run_attempt | tostring) == $attempt and
              (.workflow_id | tostring) == $workflow and
              .name == "Candidate Publication - Signed GHCR (NO DEPLOY)" and
              .path == ".github/workflows/candidate-publication.yml" and
              .event == "workflow_dispatch" and .conclusion == "success" and
              .head_branch == "main" and .head_sha == $sha and
              .head_repository.full_name == $repo and .repository.full_name == $repo
            ' "$run_file" >/dev/null
          rm -- "$run_file"
          if [ -e "$run_file" ] || [ -L "$run_file" ]; then exit 2; fi

      - name: Resolve exactly one bounded publication artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ steps.upstream.outputs.candidate_sha }}
          PUBLICATION_RUN_ID: ${{ steps.upstream.outputs.publication_run_id }}
          PUBLICATION_RUN_ATTEMPT: ${{ steps.upstream.outputs.publication_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_file="$RUNNER_TEMP/publication-artifacts-$PUBLICATION_RUN_ID.json"
          if [ -e "$artifact_file" ] || [ -L "$artifact_file" ]; then exit 2; fi
          umask 077
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLICATION_RUN_ID/artifacts?per_page=100" \
            > "$artifact_file"
          [ -f "$artifact_file" ] && [ ! -L "$artifact_file" ]
          [ "$(stat -c '%s' "$artifact_file")" -gt 0 ]
          [ "$(stat -c '%s' "$artifact_file")" -le 1048576 ]
          expected_name="i11-main-signed-candidate-$CANDIDATE_SHA-$PUBLICATION_RUN_ID-$PUBLICATION_RUN_ATTEMPT"
          jq -e --arg name "$expected_name" '
            .total_count == 1 and (.artifacts | length) == 1 and
            .artifacts[0].name == $name and .artifacts[0].expired == false and
            (.artifacts[0].id | type) == "number" and .artifacts[0].id > 0 and
            (.artifacts[0].size_in_bytes | type) == "number" and
            .artifacts[0].size_in_bytes > 0 and .artifacts[0].size_in_bytes <= 136314880 and
            (.artifacts[0].digest | test("^sha256:[0-9a-f]{64}$"))
          ' "$artifact_file" >/dev/null
          artifact_id="$(jq -r '.artifacts[0].id' "$artifact_file")"
          artifact_name="$(jq -r '.artifacts[0].name' "$artifact_file")"
          artifact_digest="$(jq -r '.artifacts[0].digest' "$artifact_file")"
          rm -- "$artifact_file"
          if [ -e "$artifact_file" ] || [ -L "$artifact_file" ]; then exit 2; fi
          {
            echo "publication_artifact_id=$artifact_id"
            echo "publication_artifact_name=$artifact_name"
            echo "publication_artifact_digest=$artifact_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Remove only exact preflight API response files
        id: preflight_cleanup
        if: ${{ always() }}
        env:
          PUBLICATION_RUN_ID: ${{ steps.upstream.outputs.publication_run_id }}
        shell: bash
        run: |
          set -u
          status=0
          for target in \
            "$RUNNER_TEMP/publication-run-$PUBLICATION_RUN_ID.json" \
            "$RUNNER_TEMP/publication-artifacts-$PUBLICATION_RUN_ID.json"; do
            if [ -f "$target" ] && [ ! -L "$target" ] && \
               [ "$(dirname "$(realpath "$target")")" = "$RUNNER_TEMP" ]; then
              rm -- "$target" || status=1
            elif [ -e "$target" ] || [ -L "$target" ]; then
              status=1
            fi
            if [ -e "$target" ] || [ -L "$target" ]; then status=1; fi
          done
          exit "$status"

  staging-rollback-rehearsal:
    name: Verify exact digests, rehearse failure, and roll back
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    env:
      CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
      PUBLICATION_RUN_ID: ${{ needs.preflight.outputs.publication_run_id }}
      PUBLICATION_RUN_ATTEMPT: ${{ needs.preflight.outputs.publication_run_attempt }}
      PUBLICATION_WORKFLOW_ID: ${{ needs.preflight.outputs.publication_workflow_id }}
      PUBLICATION_ARTIFACT_ID: ${{ needs.preflight.outputs.publication_artifact_id }}
      PUBLICATION_ARTIFACT_NAME: ${{ needs.preflight.outputs.publication_artifact_name }}
      PUBLICATION_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.publication_artifact_digest }}
    steps:
      - name: Checkout the exact published main candidate without credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-prove the protected-main source boundary
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = "Botond1/3D-Printer-Slicer-API" ]
          [ "$GITHUB_EVENT_NAME" = "workflow_run" ]
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" ]
          [ "$REGISTRY_REPOSITORY" = "ghcr.io/botond1/3d-printer-slicer-api" ]
          git fetch --no-tags --depth=1 origin refs/heads/main
          main_sha="$(git rev-parse FETCH_HEAD)"
          git merge-base --is-ancestor "$CANDIDATE_SHA" "$main_sha"

      - name: Set up Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Download and safely extract the exact publication artifact
        id: publication_artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/$PUBLICATION_ARTIFACT_SUBDIR"
          archive="$RUNNER_TEMP/signed-main-publication-$PUBLICATION_RUN_ID-$PUBLICATION_RUN_ATTEMPT.zip"
          if [ -e "$artifact_dir" ] || [ -L "$artifact_dir" ] || \
             [ -e "$archive" ] || [ -L "$archive" ]; then exit 2; fi
          umask 077
          mkdir -m 0700 -- "$artifact_dir"
          [ "$(realpath "$artifact_dir")" = "$artifact_dir" ]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PUBLICATION_ARTIFACT_ID/zip" \
            > "$archive"
          [ -f "$archive" ] && [ ! -L "$archive" ]
          archive_size="$(stat -c '%s' "$archive")"
          [ "$archive_size" -gt 0 ] && [ "$archive_size" -le 136314880 ]
          archive_digest="sha256:$(sha256sum "$archive" | awk '{print $1}')"
          [ "$archive_digest" = "$PUBLICATION_ARTIFACT_DIGEST" ]
          ARCHIVE="$archive" ARTIFACT_DIR="$artifact_dir" python3 <<'PY'
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          limits = {
              'i11-main-candidate-provenance.json': 96 * 1024,
              'image-identity.txt': 4 * 1024,
              'runtime-diagnostics.json': 64 * 1024,
              'topology-evidence.json': 16 * 1024,
              'sbom.spdx.json': 16 * 1024 * 1024,
              'grype.json': 100 * 1024 * 1024,
          }
          archive = Path(os.environ['ARCHIVE']).resolve(strict=True)
          root = Path(os.environ['ARTIFACT_DIR']).resolve(strict=True)
          if archive.parent != root.parent or root.parent != Path(os.environ['RUNNER_TEMP']).resolve():
              raise SystemExit('artifact_boundary_failure')
          with zipfile.ZipFile(archive, 'r') as source:
              infos = source.infolist()
              names = [info.filename for info in infos]
              if len(names) != len(set(names)) or sorted(names) != sorted(limits):
                  raise SystemExit('artifact_allowlist_mismatch')
              for info in infos:
                  name = info.filename
                  pure = PurePosixPath(name)
                  mode = (info.external_attr >> 16) & 0o170000
                  if pure.name != name or pure.is_absolute() or '..' in pure.parts \
                          or info.is_dir() or mode == stat.S_IFLNK or info.flag_bits & 0x1 \
                          or info.compress_type not in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED) \
                          or not 0 < info.file_size <= limits[name]:
                      raise SystemExit('artifact_entry_boundary_failure')
                  target = root / name
                  with source.open(info, 'r') as incoming, target.open('xb') as outgoing:
                      copied = shutil.copyfileobj(incoming, outgoing, length=1024 * 1024)
                  os.chmod(target, 0o600)
                  actual = target.stat()
                  if actual.st_size != info.file_size or target.resolve() != target:
                      raise SystemExit('artifact_extraction_failure')
          PY
          rm -- "$archive"
          if [ -e "$archive" ] || [ -L "$archive" ]; then exit 2; fi
          echo "PUBLICATION_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "classification=success" >> "$GITHUB_OUTPUT"

      - name: Materialize and validate the digest-only rehearsal manifest
        id: rehearsal_input
        if: ${{ steps.publication_artifact.outcome == 'success' }}
        env:
          PUBLICATION_WORKFLOW_NAME: Candidate Publication - Signed GHCR (NO DEPLOY)
          PUBLICATION_WORKFLOW_PATH: .github/workflows/candidate-publication.yml
          PUBLICATION_EVENT: workflow_dispatch
          PUBLICATION_CONCLUSION: success
          PUBLICATION_HEAD_BRANCH: main
          PUBLICATION_HEAD_SHA: ${{ needs.preflight.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          rehearsal_input_dir="$RUNNER_TEMP/$REHEARSAL_INPUT_SUBDIR"
          if [ -e "$rehearsal_input_dir" ] || [ -L "$rehearsal_input_dir" ]; then exit 2; fi
          echo "REHEARSAL_INPUT_DIR=$rehearsal_input_dir" >> "$GITHUB_ENV"
          export REHEARSAL_INPUT_DIR="$rehearsal_input_dir"
          node scripts/release-rehearsal-input.js
          manifest="$rehearsal_input_dir/signed-main-candidate-staging-rehearsal-manifest.json"
          [ -f "$manifest" ] && [ ! -L "$manifest" ]
          [ "$(dirname "$(realpath "$manifest")")" = "$rehearsal_input_dir" ]
          STAGING_REHEARSAL_MANIFEST="$manifest" node <<'NODE'
          const fs = require('node:fs');
          const {loadStagingRehearsalManifest} = require('./scripts/staging-rehearsal-manifest');
          const manifest = loadStagingRehearsalManifest(
            process.env.STAGING_REHEARSAL_MANIFEST
          ).value;
          const values = {
            STAGING_REHEARSAL_MANIFEST: process.env.STAGING_REHEARSAL_MANIFEST,
            REHEARSAL_SHA: manifest.candidate.source_sha,
            CANDIDATE_SHA: manifest.candidate.source_sha,
            CURRENT_SOURCE_SHA: manifest.candidate.source_sha,
            CURRENT_REGISTRY_DIGEST: manifest.candidate.digest,
            CURRENT_CONFIG_DIGEST: manifest.candidate.config_digest,
            CURRENT_IMAGE_REF: `${manifest.repository}@${manifest.candidate.digest}`,
            CANDIDATE_SOURCE_REF: manifest.candidate.attestation.source_ref,
            CANDIDATE_SIGNER_WORKFLOW: manifest.candidate.attestation.signer_workflow,
            PREVIOUS_SOURCE_SHA: manifest.previous.source_sha,
            PREVIOUS_REGISTRY_DIGEST: manifest.previous.digest,
            PREVIOUS_CONFIG_DIGEST: manifest.previous.config_digest,
            PREVIOUS_IMAGE_REF: `${manifest.repository}@${manifest.previous.digest}`,
            PREVIOUS_SOURCE_REF: manifest.previous.attestation.source_ref,
            PREVIOUS_SIGNER_WORKFLOW: manifest.previous.attestation.signer_workflow
          };
          for (const value of Object.values(values)) {
            if (typeof value !== 'string' || value.includes('\n')) process.exit(2);
          }
          fs.appendFileSync(process.env.GITHUB_ENV,
            Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE
          echo "classification=success" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx for bounded manifest inspection
        if: ${{ steps.rehearsal_input.outcome == 'success' }}
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Authenticate read-only to the fixed GHCR repository
        id: registry_login
        if: ${{ steps.rehearsal_input.outcome == 'success' }}
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove both exact digest manifests and image identities
        id: registry_identity
        if: ${{ steps.registry_login.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          verification_dir="$RUNNER_TEMP/$VERIFICATION_SUBDIR"
          if [ -e "$verification_dir" ] || [ -L "$verification_dir" ]; then exit 2; fi
          mkdir -m 0700 -- "$verification_dir"
          [ "$(realpath "$verification_dir")" = "$verification_dir" ]
          echo "VERIFICATION_DIR=$verification_dir" >> "$GITHUB_ENV"

          inspect_candidate() {
            local label="$1" source_sha="$2"
            local expected_digest="$3" expected_config="$4"
            local digest_ref="$REGISTRY_REPOSITORY@$expected_digest"
            local digest_raw="$verification_dir/$label-digest-raw.json"
            local digest_summary="$verification_dir/$label-digest-summary.json"
            docker buildx imagetools inspect "$digest_ref" --raw > "$digest_raw"
            docker buildx imagetools inspect "$digest_ref" --format '{{json .}}' > "$digest_summary"
            for target in "$digest_raw" "$digest_summary"; do
              [ -f "$target" ] && [ ! -L "$target" ]
              size="$(stat -c '%s' "$target")"
              [ "$size" -gt 0 ] && [ "$size" -le 262144 ]
              [ "$(dirname "$(realpath "$target")")" = "$verification_dir" ]
            done
            digest_hash="sha256:$(sha256sum "$digest_raw" | awk '{print $1}')"
            [ "$digest_hash" = "$expected_digest" ]
            LABEL="$label" SOURCE_SHA="$source_sha" EXPECTED_DIGEST="$expected_digest" \
              EXPECTED_CONFIG="$expected_config" DIGEST_RAW="$digest_raw" \
              DIGEST_SUMMARY="$digest_summary" node <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync(process.env.DIGEST_RAW, 'utf8'));
          const summary = JSON.parse(fs.readFileSync(process.env.DIGEST_SUMMARY, 'utf8'));
          const image = summary?.image;
          if (typeof raw?.mediaType !== 'string' || raw.mediaType.includes('index')
              || raw?.config?.digest !== process.env.EXPECTED_CONFIG
              || summary?.manifest?.digest !== process.env.EXPECTED_DIGEST
              || summary?.manifest?.mediaType?.includes('index')
              || image?.os !== 'linux' || image?.architecture !== 'amd64'
              || image?.config?.User !== 'slicer'
              || image?.config?.Labels?.['org.opencontainers.image.revision']
                  !== process.env.SOURCE_SHA
              || image?.config?.Labels?.['org.opencontainers.image.source']
                  !== `https://github.com/${process.env.GITHUB_REPOSITORY}`) process.exit(2);
          NODE
          }

          inspect_candidate candidate "$CURRENT_SOURCE_SHA" \
            "$CURRENT_REGISTRY_DIGEST" "$CURRENT_CONFIG_DIGEST"
          inspect_candidate previous "$PREVIOUS_SOURCE_SHA" \
            "$PREVIOUS_REGISTRY_DIGEST" "$PREVIOUS_CONFIG_DIGEST"
          echo "classification=success" >> "$GITHUB_OUTPUT"

      - name: Verify both candidates' provenance and SBOM attestations through API and OCI
        id: attestation_verification
        if: ${{ steps.registry_identity.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$VERIFICATION_DIR" = "$RUNNER_TEMP/$VERIFICATION_SUBDIR" ]
          [ "$(realpath "$VERIFICATION_DIR")" = "$VERIFICATION_DIR" ]

          verify_candidate() {
            local label="$1" source_sha="$2" source_ref="$3" signer_workflow="$4"
            local digest="$5"
            local digest_ref="$REGISTRY_REPOSITORY@$digest"
            local cert_identity="https://github.com/$GITHUB_REPOSITORY/$signer_workflow@$source_ref"
            local common_args=(--repo "$GITHUB_REPOSITORY" --cert-identity "$cert_identity"
              --signer-digest "$source_sha" --source-ref "$source_ref"
              --source-digest "$source_sha"
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" --format json)
            for predicate_label in provenance sbom; do
              if [ "$predicate_label" = "provenance" ]; then
                predicate="https://slsa.dev/provenance/v1"
              else
                predicate="https://spdx.dev/Document/v2.3"
              fi
              gh attestation verify "oci://$digest_ref" "${common_args[@]}" \
                --predicate-type "$predicate" > \
                "$VERIFICATION_DIR/$label-$predicate_label-api.json"
              gh attestation verify "oci://$digest_ref" "${common_args[@]}" \
                --predicate-type "$predicate" --bundle-from-oci > \
                "$VERIFICATION_DIR/$label-$predicate_label-oci.json"
            done
          }

          verify_candidate candidate "$CURRENT_SOURCE_SHA" "$CANDIDATE_SOURCE_REF" \
            "$CANDIDATE_SIGNER_WORKFLOW" "$CURRENT_REGISTRY_DIGEST"
          verify_candidate previous "$PREVIOUS_SOURCE_SHA" "$PREVIOUS_SOURCE_REF" \
            "$PREVIOUS_SIGNER_WORKFLOW" "$PREVIOUS_REGISTRY_DIGEST"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const candidates = {
            candidate: {
              source: process.env.CURRENT_SOURCE_SHA,
              sourceRef: process.env.CANDIDATE_SOURCE_REF,
              workflow: process.env.CANDIDATE_SIGNER_WORKFLOW,
              digest: process.env.CURRENT_REGISTRY_DIGEST
            },
            previous: {
              source: process.env.PREVIOUS_SOURCE_SHA,
              sourceRef: process.env.PREVIOUS_SOURCE_REF,
              workflow: process.env.PREVIOUS_SIGNER_WORKFLOW,
              digest: process.env.PREVIOUS_REGISTRY_DIGEST
            }
          };
          const predicates = {
            provenance: 'https://slsa.dev/provenance/v1',
            sbom: 'https://spdx.dev/Document/v2.3'
          };
          const MAX_VERIFICATION_RESULT_BYTES = 32 * 1024 * 1024;
          for (const [label, candidate] of Object.entries(candidates)) {
            const certIdentity = `https://github.com/${process.env.GITHUB_REPOSITORY}/`
              + `${candidate.workflow}@${candidate.sourceRef}`;
            for (const [predicateLabel, predicate] of Object.entries(predicates)) {
              for (const mode of ['api', 'oci']) {
                const target = path.join(process.env.VERIFICATION_DIR,
                  `${label}-${predicateLabel}-${mode}.json`);
                const stat = fs.lstatSync(target);
                if (!stat.isFile() || stat.isSymbolicLink() || stat.size <= 0
                    || stat.size > MAX_VERIFICATION_RESULT_BYTES
                    || path.dirname(fs.realpathSync(target)) !== process.env.VERIFICATION_DIR) process.exit(2);
                const result = JSON.parse(fs.readFileSync(target, 'utf8'));
                const matched = Array.isArray(result) && result.some((entry) => {
                  const verification = entry?.verificationResult;
                  const certificate = verification?.signature?.certificate;
                  return verification?.statement?.predicateType === predicate
                    && verification.statement.subject?.some((subject) =>
                      subject?.name === process.env.REGISTRY_REPOSITORY
                      && subject?.digest?.sha256 === candidate.digest.slice(7))
                    && verification.verifiedTimestamps?.length > 0
                    && certificate?.subjectAlternativeName === certIdentity
                    && certificate?.buildSignerURI === certIdentity
                    && certificate?.buildSignerDigest === candidate.source
                    && certificate?.sourceRepositoryURI
                      === `https://github.com/${process.env.GITHUB_REPOSITORY}`
                    && certificate?.sourceRepositoryRef === candidate.sourceRef
                    && certificate?.sourceRepositoryDigest === candidate.source
                    && certificate?.issuer === 'https://token.actions.githubusercontent.com';
                });
                if (!matched) process.exit(2);
              }
            }
          }
          NODE
          echo "classification=success" >> "$GITHUB_OUTPUT"

      - name: Remove only exact bounded registry and attestation verification inputs
        id: verification_cleanup
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -u
          status=0
          verification_dir="$RUNNER_TEMP/$VERIFICATION_SUBDIR"
          if [ -L "$verification_dir" ]; then
            status=1
          elif [ -d "$verification_dir" ]; then
            allowed='^(candidate|previous)-(digest-raw|digest-summary|provenance-api|provenance-oci|sbom-api|sbom-oci)\.json$'
            while IFS= read -r -d '' target; do
              name="$(basename "$target")"
              if [[ ! "$name" =~ $allowed ]] || [ ! -f "$target" ] || [ -L "$target" ] || \
                 [ "$(dirname "$(realpath "$target")")" != "$verification_dir" ]; then
                status=1
                continue
              fi
              rm -- "$target" || status=1
            done < <(find "$verification_dir" -mindepth 1 -maxdepth 1 -print0)
            rmdir -- "$verification_dir" || status=1
          elif [ -e "$verification_dir" ]; then
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            echo "classification=verification_cleanup_failure" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi
          echo "classification=success" >> "$GITHUB_OUTPUT"

      - name: Prepare the exact bounded rehearsal evidence directory
        id: evidence_setup
        if: ${{ steps.attestation_verification.outcome == 'success' && steps.verification_cleanup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/$EVIDENCE_SUBDIR"
          if [ -e "$evidence_dir" ] || [ -L "$evidence_dir" ]; then exit 2; fi
          mkdir -m 0700 -- "$evidence_dir"
          [ "$(realpath "$evidence_dir")" = "$evidence_dir" ]
          echo "EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          echo "classification=success" >> "$GITHUB_OUTPUT"

      - name: Pull both immutable digests and resolve the shared non-root service identity
        id: runtime_images
        if: ${{ steps.evidence_setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PREVIOUS_IMAGE_REF" >/dev/null
          docker pull "$CURRENT_IMAGE_REF" >/dev/null

          resolve_identity() {
            local label="$1" image_ref="$2" expected_config="$3"
            local record
            record="$(docker image inspect --format '{{.Id}}|{{json .Config.User}}' "$image_ref")"
            [ "$record" = "$expected_config|\"slicer\"" ]
            local probe_name="i9-id-$label-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if docker container inspect "$probe_name" >/dev/null 2>&1; then exit 2; fi
            local uid gid
            uid="$(timeout 20s docker run --rm --name "$probe_name" --pull never \
              --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 16 \
              --memory 64m --memory-swap 64m --cpus 0.25 \
              --label io.s3b.rehearsal=true \
              --label "io.s3b.run-id=$GITHUB_RUN_ID" \
              --label "io.s3b.expected-image=$expected_config" \
              --entrypoint /usr/bin/id "$image_ref" -u)"
            if docker container inspect "$probe_name" >/dev/null 2>&1; then exit 2; fi
            gid="$(timeout 20s docker run --rm --name "$probe_name" --pull never \
              --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 16 \
              --memory 64m --memory-swap 64m --cpus 0.25 \
              --label io.s3b.rehearsal=true \
              --label "io.s3b.run-id=$GITHUB_RUN_ID" \
              --label "io.s3b.expected-image=$expected_config" \
              --entrypoint /usr/bin/id "$image_ref" -g)"
            if docker container inspect "$probe_name" >/dev/null 2>&1; then exit 2; fi
            [[ "$uid" =~ ^[1-9][0-9]*$ ]] && [[ "$gid" =~ ^[1-9][0-9]*$ ]]
            printf '%s:%s\n' "$uid" "$gid"
          }

          previous_identity="$(resolve_identity previous "$PREVIOUS_IMAGE_REF" "$PREVIOUS_CONFIG_DIGEST")"
          candidate_identity="$(resolve_identity candidate "$CURRENT_IMAGE_REF" "$CURRENT_CONFIG_DIGEST")"
          [ "$previous_identity" = "$candidate_identity" ]
          service_uid="${candidate_identity%%:*}"
          service_gid="${candidate_identity##*:}"
          [ "$service_uid" != "0" ] && [ "$service_gid" != "0" ]
          {
            echo "SLICER_UID=$service_uid"
            echo "SLICER_GID=$service_gid"
          } >> "$GITHUB_ENV"
          echo "classification=success" >> "$GITHUB_OUTPUT"

      - name: Prepare run-owned staging state and inert scoped credentials
        id: runtime_setup
        if: ${{ steps.runtime_images.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          stage_root="$RUNNER_TEMP/i9-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -e "$stage_root" ] || [ -L "$stage_root" ]; then exit 2; fi
          mkdir -m 0700 -- "$stage_root"
          [ "$(realpath "$stage_root")" = "$stage_root" ]
          for name in input output pricing-state; do
            sudo --non-interactive install -d -o "$SLICER_UID" -g "$SLICER_GID" \
              -m 0700 -- "$stage_root/$name"
            [ "$(stat -c '%u:%g:%a:%F' "$stage_root/$name")" \
              = "$SLICER_UID:$SLICER_GID:700:directory" ]
            [ "$(realpath "$stage_root/$name")" = "$stage_root/$name" ]
          done

          env_file="$stage_root/service.env"
          slice_key="$(openssl rand -hex 32)"
          pricing_key="$(openssl rand -hex 32)"
          artifact_key="$(openssl rand -hex 32)"
          operations_key="$(openssl rand -hex 32)"
          [ "$slice_key" != "$pricing_key" ] && [ "$slice_key" != "$artifact_key" ] && \
            [ "$slice_key" != "$operations_key" ] && [ "$pricing_key" != "$artifact_key" ] && \
            [ "$pricing_key" != "$operations_key" ] && [ "$artifact_key" != "$operations_key" ]
          {
            printf 'NODE_ENV=production\nPORT=3000\nTRUST_PROXY=false\n'
            printf 'SLICE_SERVICE_API_KEY=%s\n' "$slice_key"
            printf 'PRICING_API_KEY=%s\n' "$pricing_key"
            printf 'ARTIFACT_API_KEY=%s\n' "$artifact_key"
            printf 'OPERATIONS_API_KEY=%s\n' "$operations_key"
          } > "$env_file"
          [ "$(stat -c '%a:%F' "$env_file")" = "600:regular file" ]
          [ "$(dirname "$(realpath "$env_file")")" = "$stage_root" ]
          {
            echo "I9_STAGE_ROOT=$stage_root"
            echo "SLICER_ENV_FILE=$env_file"
            echo "SLICER_INPUT_DIR=$stage_root/input"
            echo "SLICER_OUTPUT_DIR=$stage_root/output"
            echo "SLICER_CONFIGS_DIR=$GITHUB_WORKSPACE/configs"
            echo "SLICER_PRICING_STATE_DIR=$stage_root/pricing-state"
          } >> "$GITHUB_ENV"
          echo "classification=success" >> "$GITHUB_OUTPUT"

      - name: Run the bounded production-Compose staging and automatic rollback rehearsal
        id: rehearsal
        if: ${{ steps.runtime_setup.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$SLICER_ENV_FILE"
          set +a
          node scripts/i9-staging-rollback-rehearsal.js

      - name: Verify or remove only the exact run-owned staging directory
        id: runtime_post_cleanup
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -u
          status=0
          remove_owned_container() {
            local reference="$1" expected_kind="$2"
            local record inspect_status
            record=""
            if record="$(docker container inspect --format \
                '{{.Id}}|{{.Image}}|{{index .Config.Labels "io.s3b.rehearsal"}}|{{index .Config.Labels "io.s3b.run-id"}}|{{index .Config.Labels "com.docker.compose.project"}}|{{index .Config.Labels "com.docker.compose.service"}}' \
                "$reference" 2>/dev/null)"; then
              inspect_status=0
            else
              inspect_status=$?
            fi
            if [ "$inspect_status" -eq 1 ] && [ -z "$record" ]; then return 0; fi
            if [ "$inspect_status" -ne 0 ]; then return 1; fi
            IFS='|' read -r container_id image_id rehearsal_label run_label \
              compose_project compose_service <<EOF
          $record
          EOF
            case "$image_id" in
              "$CURRENT_CONFIG_DIGEST"|"$PREVIOUS_CONFIG_DIGEST") ;;
              *) return 1 ;;
            esac
            if [ "$expected_kind" = "compose" ]; then
              [ "$compose_project" = "i9-s3b-rehearsal" ] && \
                [ "$compose_service" = "slicer-api" ] || return 1
            else
              [ "$rehearsal_label" = "true" ] && \
                [ "$run_label" = "$GITHUB_RUN_ID" ] || return 1
            fi
            [[ "$container_id" =~ ^[0-9a-f]{64}$ ]] || return 1
            docker container rm --force "$container_id" >/dev/null || return 1
          }
          for reference in \
            "i9-id-previous-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "i9-id-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "i9-peer-previous-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "i9-peer-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "i9-peer-rollback-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "i9-peer-failure-rollback-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; do
            remove_owned_container "$reference" rehearsal || status=1
          done
          remove_owned_container 3d-psa-backend-server compose || status=1

          network_record=""
          if network_record="$(docker network inspect --format \
              '{{.Id}}|{{index .Labels "com.docker.compose.project"}}|{{index .Labels "com.docker.compose.network"}}' \
              slicer-api-private 2>/dev/null)"; then
            network_status=0
          else
            network_status=$?
          fi
          if [ "$network_status" -eq 0 ]; then
            IFS='|' read -r network_id network_project network_role <<EOF
          $network_record
          EOF
            if [[ ! "$network_id" =~ ^[0-9a-f]{64}$ ]] || \
               [ "$network_project" != "i9-s3b-rehearsal" ] || \
               [ "$network_role" != "slicer-api-private" ]; then
              status=1
            else
              docker network rm "$network_id" >/dev/null || status=1
            fi
          elif [ "$network_status" -ne 1 ] || [ -n "$network_record" ]; then
            status=1
          fi

          for image_ref in "$CURRENT_IMAGE_REF" "$PREVIOUS_IMAGE_REF"; do
            if docker image inspect "$image_ref" >/dev/null 2>&1; then
              docker image rm "$image_ref" >/dev/null || status=1
            fi
            if docker image inspect "$image_ref" >/dev/null 2>&1; then status=1; fi
          done

          stage_root="$RUNNER_TEMP/i9-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -L "$stage_root" ]; then
            status=1
          elif [ -d "$stage_root" ]; then
            if [ "$(dirname "$stage_root")" != "$RUNNER_TEMP" ] || \
               [ "$(realpath "$stage_root")" != "$stage_root" ]; then
              status=1
            else
              sudo --non-interactive rm --recursive --force --one-file-system -- "$stage_root" \
                || status=1
            fi
          elif [ -e "$stage_root" ]; then
            status=1
          fi
          if [ -e "$stage_root" ] || [ -L "$stage_root" ]; then status=1; fi
          if [ "$status" -ne 0 ]; then
            echo "classification=runtime_post_cleanup_failure" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi
          echo "classification=success" >> "$GITHUB_OUTPUT"

      - name: Generate bounded signed-main-candidate rehearsal evidence
        id: evidence_write
        if: ${{ always() && steps.evidence_setup.outcome == 'success' }}
        continue-on-error: true
        env:
          REHEARSAL_INPUT_OUTCOME: ${{ steps.rehearsal_input.outcome }}
          REGISTRY_IDENTITY_OUTCOME: ${{ steps.registry_identity.outcome }}
          ATTESTATION_VERIFICATION_OUTCOME: ${{ steps.attestation_verification.outcome }}
          VERIFICATION_CLEANUP_OUTCOME: ${{ steps.verification_cleanup.outcome }}
          REHEARSAL_OUTCOME: ${{ steps.rehearsal.outcome }}
          REHEARSAL_CLASSIFICATION: ${{ steps.rehearsal.outputs.classification }}
          ROLLBACK_CLASSIFICATION: ${{ steps.rehearsal.outputs.rollback_classification }}
          RUNTIME_CLEANUP_CLASSIFICATION: ${{ steps.rehearsal.outputs.cleanup_classification }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-staging-rehearsal-evidence.js

      - name: Require the exact bounded signed-main-candidate evidence contract
        id: evidence_boundary
        if: ${{ steps.evidence_write.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {
            EVIDENCE_FILE,
            MAX_EVIDENCE_BYTES,
            validateStagingRehearsalEvidence
          } = require('./scripts/staging-rehearsal-evidence');
          const {
            loadStagingRehearsalManifest
          } = require('./scripts/staging-rehearsal-manifest');
          const root = path.resolve(process.env.RUNNER_TEMP, process.env.EVIDENCE_SUBDIR);
          if (process.env.EVIDENCE_DIR !== root || fs.realpathSync(root) !== root) process.exit(2);
          const target = path.join(root, EVIDENCE_FILE);
          const stat = fs.lstatSync(target);
          if (!stat.isFile() || stat.isSymbolicLink() || stat.size <= 0
              || stat.size > MAX_EVIDENCE_BYTES || path.dirname(fs.realpathSync(target)) !== root) process.exit(2);
          const value = JSON.parse(fs.readFileSync(target, 'utf8'));
          const manifest = loadStagingRehearsalManifest(
            process.env.STAGING_REHEARSAL_MANIFEST
          ).value;
          const error = validateStagingRehearsalEvidence(value, {
            repository: process.env.GITHUB_REPOSITORY,
            rehearsal_sha: process.env.CANDIDATE_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            job: process.env.GITHUB_JOB,
            publication_run_id: manifest.artifact.publication_run_id,
            publication_run_attempt: manifest.artifact.publication_run_attempt,
            publication_artifact_id: manifest.artifact.artifact_id,
            publication_artifact_digest: manifest.artifact.artifact_digest,
            previous_source_sha: manifest.previous.source_sha,
            previous_registry_digest: manifest.previous.digest,
            previous_config_digest: manifest.previous.config_digest,
            candidate_source_sha: manifest.candidate.source_sha,
            candidate_registry_digest: manifest.candidate.digest,
            candidate_config_digest: manifest.candidate.config_digest
          });
          if (error) {
            console.error(error);
            process.exit(2);
          }
          NODE
          echo "classification=success" >> "$GITHUB_OUTPUT"

      - name: Upload only the bounded signed-main-candidate rehearsal evidence
        id: evidence_upload
        if: ${{ steps.evidence_boundary.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signed-main-candidate-staging-rollback-evidence-${{ needs.preflight.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.EVIDENCE_SUBDIR }}/signed-main-candidate-staging-rollback-evidence.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false

      - name: Remove only exact bounded evidence and publication inputs
        id: evidence_cleanup
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -u
          status=0
          remove_allowlisted_dir() {
            local directory="$1" allowed="$2"
            if [ -L "$directory" ]; then
              return 1
            elif [ -d "$directory" ]; then
              if [ "$(dirname "$directory")" != "$RUNNER_TEMP" ] || \
                 [ "$(realpath "$directory")" != "$directory" ]; then return 1; fi
              while IFS= read -r -d '' target; do
                name="$(basename "$target")"
                if [[ ! "$name" =~ $allowed ]] || [ ! -f "$target" ] || [ -L "$target" ] || \
                   [ "$(dirname "$(realpath "$target")")" != "$directory" ]; then
                  status=1
                  continue
                fi
                rm -- "$target" || status=1
              done < <(find "$directory" -mindepth 1 -maxdepth 1 -print0)
              if find "$directory" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
                status=1
              else
                rmdir -- "$directory" || status=1
              fi
            elif [ -e "$directory" ]; then
              return 1
            fi
          }
          evidence_allowed='^(i9-staging-runtime-draft|signed-main-candidate-staging-rollback-evidence)\.json$'
          input_allowed='^signed-main-candidate-staging-rehearsal-manifest\.json$'
          artifact_allowed='^(i11-main-candidate-provenance\.json|image-identity\.txt|runtime-diagnostics\.json|topology-evidence\.json|sbom\.spdx\.json|grype\.json)$'
          remove_allowlisted_dir "$RUNNER_TEMP/$EVIDENCE_SUBDIR" "$evidence_allowed" || status=1
          remove_allowlisted_dir "$RUNNER_TEMP/$REHEARSAL_INPUT_SUBDIR" "$input_allowed" || status=1
          remove_allowlisted_dir "$RUNNER_TEMP/$PUBLICATION_ARTIFACT_SUBDIR" "$artifact_allowed" || status=1
          archive="$RUNNER_TEMP/signed-main-publication-$PUBLICATION_RUN_ID-$PUBLICATION_RUN_ATTEMPT.zip"
          if [ -f "$archive" ] && [ ! -L "$archive" ] && \
             [ "$(dirname "$(realpath "$archive")")" = "$RUNNER_TEMP" ]; then
            rm -- "$archive" || status=1
          elif [ -e "$archive" ] || [ -L "$archive" ]; then
            status=1
          fi
          if [ -e "$archive" ] || [ -L "$archive" ]; then status=1; fi
          if [ "$status" -ne 0 ]; then
            echo "classification=bounded_input_cleanup_failure" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi
          echo "classification=success" >> "$GITHUB_OUTPUT"

      - name: Enforce the final fail-closed signed-main-candidate rehearsal result
        id: final_enforcement
        if: ${{ always() }}
        env:
          PUBLICATION_ARTIFACT_OUTCOME: ${{ steps.publication_artifact.outcome }}
          REHEARSAL_INPUT_OUTCOME: ${{ steps.rehearsal_input.outcome }}
          REGISTRY_LOGIN_OUTCOME: ${{ steps.registry_login.outcome }}
          REGISTRY_IDENTITY_OUTCOME: ${{ steps.registry_identity.outcome }}
          ATTESTATION_VERIFICATION_OUTCOME: ${{ steps.attestation_verification.outcome }}
          VERIFICATION_CLEANUP_OUTCOME: ${{ steps.verification_cleanup.outcome }}
          EVIDENCE_SETUP_OUTCOME: ${{ steps.evidence_setup.outcome }}
          RUNTIME_IMAGES_OUTCOME: ${{ steps.runtime_images.outcome }}
          RUNTIME_SETUP_OUTCOME: ${{ steps.runtime_setup.outcome }}
          REHEARSAL_OUTCOME: ${{ steps.rehearsal.outcome }}
          REHEARSAL_CLASSIFICATION: ${{ steps.rehearsal.outputs.classification }}
          ROLLBACK_CLASSIFICATION: ${{ steps.rehearsal.outputs.rollback_classification }}
          RUNTIME_CLEANUP_CLASSIFICATION: ${{ steps.rehearsal.outputs.cleanup_classification }}
          RUNTIME_POST_CLEANUP_OUTCOME: ${{ steps.runtime_post_cleanup.outcome }}
          EVIDENCE_WRITE_OUTCOME: ${{ steps.evidence_write.outcome }}
          EVIDENCE_BOUNDARY_OUTCOME: ${{ steps.evidence_boundary.outcome }}
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          EVIDENCE_CLEANUP_OUTCOME: ${{ steps.evidence_cleanup.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          classification=SIGNED_MAIN_CANDIDATE_EPHEMERAL_REHEARSAL_COMPLETE
          failed_step=none
          if [ "$VERIFICATION_CLEANUP_OUTCOME" != "success" ] || \
             [ "$RUNTIME_POST_CLEANUP_OUTCOME" != "success" ] || \
             [ "$EVIDENCE_CLEANUP_OUTCOME" != "success" ]; then
            classification=BLOCKED_SIGNED_MAIN_CANDIDATE_CLEANUP_FAILURE
            failed_step=cleanup
          elif [ "$PUBLICATION_ARTIFACT_OUTCOME" != "success" ]; then
            classification=BLOCKED_SIGNED_MAIN_CANDIDATE_ARTIFACT
            failed_step=publication_artifact
          elif [ "$REHEARSAL_INPUT_OUTCOME" != "success" ]; then
            classification=BLOCKED_SIGNED_MAIN_CANDIDATE_REHEARSAL_INPUT
            failed_step=rehearsal_input
          elif [ "$REGISTRY_LOGIN_OUTCOME" != "success" ] || \
               [ "$REGISTRY_IDENTITY_OUTCOME" != "success" ]; then
            classification=BLOCKED_SIGNED_MAIN_CANDIDATE_REGISTRY_READ
            failed_step=registry_identity
          elif [ "$ATTESTATION_VERIFICATION_OUTCOME" != "success" ]; then
            classification=BLOCKED_SIGNED_MAIN_CANDIDATE_ATTESTATION
            failed_step=attestation_verification
          elif [ "$RUNTIME_IMAGES_OUTCOME" != "success" ]; then
            classification=BLOCKED_SIGNED_MAIN_CANDIDATE_RUNTIME_IDENTITY
            failed_step=runtime_images
          elif [ "$RUNTIME_SETUP_OUTCOME" != "success" ]; then
            classification=BLOCKED_SIGNED_MAIN_CANDIDATE_HOST_OWNERSHIP
            failed_step=runtime_setup
          elif [ "$RUNTIME_CLEANUP_CLASSIFICATION" != "success" ]; then
            classification=BLOCKED_SIGNED_MAIN_CANDIDATE_CLEANUP_FAILURE
            failed_step=runtime_cleanup
          elif [ "$ROLLBACK_CLASSIFICATION" != "success" ]; then
            classification=BLOCKED_SIGNED_MAIN_CANDIDATE_ROLLBACK
            failed_step=rollback
          elif [ "$REHEARSAL_OUTCOME" != "success" ] || \
               [ "$REHEARSAL_CLASSIFICATION" != "success" ]; then
            classification=BLOCKED_SIGNED_MAIN_CANDIDATE_REHEARSAL
            failed_step=rehearsal
          elif [ "$EVIDENCE_SETUP_OUTCOME" != "success" ] || \
               [ "$EVIDENCE_WRITE_OUTCOME" != "success" ] || \
               [ "$EVIDENCE_BOUNDARY_OUTCOME" != "success" ] || \
               [ "$EVIDENCE_UPLOAD_OUTCOME" != "success" ]; then
            classification=BLOCKED_SIGNED_MAIN_CANDIDATE_EVIDENCE
            failed_step=evidence
          fi
          {
            echo "### Signed main candidate ephemeral staging and rollback rehearsal"
            echo
            echo "Classification: \`$classification\`."
            echo "Failed step: \`$failed_step\`."
            echo "Runtime cleanup: \`$RUNTIME_CLEANUP_CLASSIFICATION\`."
            echo "Evidence cleanup: \`$EVIDENCE_CLEANUP_OUTCOME\`."
            echo "This run used hosted ephemeral Docker only; it did not deploy to a VPS or production."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$classification" != "SIGNED_MAIN_CANDIDATE_EPHEMERAL_REHEARSAL_COMPLETE" ]; then
            echo "::error title=Signed main candidate rehearsal::$classification"
            exit 1
          fi
