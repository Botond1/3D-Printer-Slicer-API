name: Production Candidate Preflight (NO DEPLOY)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to validate without deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-candidate-preflight-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  source-validation:
    name: Source gate for exact candidate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}

  image-validation:
    name: Image gate for exact candidate
    permissions:
      contents: read
    uses: ./.github/workflows/image-validation.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}

  no-deploy-boundary:
    name: Record validation-only boundary
    if: ${{ always() }}
    needs:
      - source-validation
      - image-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      SOURCE_RESULT: ${{ needs.source-validation.result }}
      IMAGE_RESULT: ${{ needs.image-validation.result }}
    steps:
      - name: Summarize the NO DEPLOY result
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Production candidate preflight - NO DEPLOY"
            echo
            echo "Candidate: \`$CANDIDATE_SHA\`"
            echo "Source validation: \`$SOURCE_RESULT\`"
            echo "Image validation: \`$IMAGE_RESULT\`"
            echo
            echo "This run did not publish, promote, approve, deploy, or prove rollback/readiness."
            echo "Production promotion remains intentionally unavailable pending S4, then S3b."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SOURCE_RESULT" != "success" ] || [ "$IMAGE_RESULT" != "success" ]; then
            echo "One or more validation gates did not succeed." >&2
            exit 1
          fi
