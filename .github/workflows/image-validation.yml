name: Image Validation - Build Once (NO PUSH / NO DEPLOY)

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to validate
        required: true
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image-validation-${{ github.workflow }}-${{ github.ref }}-${{ inputs.candidate_sha }}
  cancel-in-progress: true

jobs:
  validate-image:
    name: Build once, inspect, scan, and discard (NO DEPLOY)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CONTAINER_NAME: s3a-validation-${{ github.run_id }}-${{ github.run_attempt }}
      I2_UID_PROBE_NAME: i2-uid-${{ github.run_id }}-${{ github.run_attempt }}
      I2_GID_PROBE_NAME: i2-gid-${{ github.run_id }}-${{ github.run_attempt }}
      I2_ORCA_PROBE_NAME: i2-orca-${{ github.run_id }}-${{ github.run_attempt }}
      I5_TOPOLOGY_PROBE_NAME: i5-topology-${{ github.run_id }}-${{ github.run_attempt }}
      I5_PRIVATE_NETWORK_NAME: i5-private-${{ github.run_id }}-${{ github.run_attempt }}
      I5_EGRESS_SENTINEL_NAME: i5-sentinel-${{ github.run_id }}-${{ github.run_attempt }}
      I5_SENTINEL_NETWORK_NAME: i5-sentinel-net-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_SUBDIR: s3a-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
    steps:
      - name: Resolve and require a full lowercase commit SHA
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CANDIDATE_SHA: ${{ github.sha }}
          REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          HAS_REQUESTED_CANDIDATE: ${{ contains(toJSON(inputs), '"candidate_sha"') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$HAS_REQUESTED_CANDIDATE" = "true" ]; then
            candidate_sha="$REQUESTED_CANDIDATE_SHA"
          elif [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then
            candidate_sha="$EVENT_CANDIDATE_SHA"
          else
            echo "An explicit candidate_sha input is required for this invocation." >&2
            exit 1
          fi

          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a full 40-character lowercase commit SHA." >&2
            exit 1
          fi

          evidence_dir="$RUNNER_TEMP/$EVIDENCE_SUBDIR"
          if [ -e "$evidence_dir" ] || [ -L "$evidence_dir" ]; then
            echo "The run-scoped evidence path already exists or is a symbolic link." >&2
            exit 1
          fi
          mkdir -m 0700 -- "$evidence_dir"
          echo "EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          : > "$evidence_dir/syft.yaml"
          : > "$evidence_dir/grype.yaml"
          if [ ! -f "$evidence_dir/syft.yaml" ] || [ -L "$evidence_dir/syft.yaml" ] || \
             [ ! -f "$evidence_dir/grype.yaml" ] || [ -L "$evidence_dir/grype.yaml" ]; then
            echo "Trusted scanner configuration files were not created as regular files." >&2
            exit 1
          fi

          image_ref="local/slicer-api-validation:$candidate_sha"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$image_ref" >> "$GITHUB_ENV"

      - name: Checkout the exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove the checked-out candidate identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$CANDIDATE_SHA" ]; then
            echo "Expected $CANDIDATE_SHA, checked out $actual_sha." >&2
            exit 1
          fi
          git cat-file -e "$CANDIDATE_SHA^{commit}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: v0.35.0
          cache-binary: false
          cleanup: true

      - name: Build the exact candidate image once and load it locally
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          no-cache: true
          provenance: false
          sbom: false
          tags: ${{ steps.candidate.outputs.image_ref }}
          labels: |
            org.opencontainers.image.revision=${{ steps.candidate.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          github-token: ''

      - name: Record and verify local image identity
        id: image_identity
        env:
          BUILD_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          actual_image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          revision_label="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_REF")"

          if [ -z "$actual_image_id" ]; then
            echo "The loaded image has no local image ID." >&2
            exit 1
          fi
          if [ -n "$BUILD_IMAGE_ID" ] && [ "$actual_image_id" != "$BUILD_IMAGE_ID" ]; then
            echo "Build output image ID $BUILD_IMAGE_ID differs from loaded image ID $actual_image_id." >&2
            exit 1
          fi
          if [ "$revision_label" != "$CANDIDATE_SHA" ]; then
            echo "Image revision label $revision_label differs from candidate $CANDIDATE_SHA." >&2
            exit 1
          fi
          echo "image_id=$actual_image_id" >> "$GITHUB_OUTPUT"

          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "local_image_ref=$IMAGE_REF"
            echo "local_image_id=$actual_image_id"
            echo "build_action_image_id=$BUILD_IMAGE_ID"
            echo "identity_scope=local-loaded-image-only"
            echo "registry_digest=not_applicable_no_push"
            echo "signature=not_created"
            echo "attestation=not_created"
          } > "$EVIDENCE_DIR/image-identity.txt"

      - name: Resolve the exact image service identity without a network
        id: runtime_identity
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          EXPECTED_IMAGE_ID: ${{ steps.image_identity.outputs.image_id }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/i2-image-runtime-diagnostics.js

      - name: Start an isolated inert container from the exact image
        id: container_start
        if: ${{ steps.runtime_identity.outcome == 'success' }}
        env:
          CONFIGURED_USER: ${{ steps.runtime_identity.outputs.configured_user }}
          SERVICE_UID: ${{ steps.runtime_identity.outputs.uid }}
          SERVICE_GID: ${{ steps.runtime_identity.outputs.gid }}
          EXPECTED_IMAGE_ID: ${{ steps.image_identity.outputs.image_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIGURED_USER" != "slicer" ] || [[ ! "$SERVICE_UID" =~ ^[0-9]+$ ]] || \
             [[ ! "$SERVICE_GID" =~ ^[0-9]+$ ]] || [ "$SERVICE_UID" = "0" ] || [ "$SERVICE_GID" = "0" ]; then
            echo "::error title=I2 runtime identity::runtime_identity_contract_failure"
            exit 2
          fi
          inert_slice_service_key="i5-validation-slice-active-260723-a1"
          docker run --detach \
            --name "$CONTAINER_NAME" \
            --pull never \
            --restart no \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --read-only \
            --pids-limit 512 \
            --memory 4g \
            --memory-swap 4g \
            --cpus 2 \
            --stop-timeout 30 \
            --log-driver json-file \
            --log-opt max-size=20m \
            --log-opt max-file=5 \
            --tmpfs "/app/input:rw,nosuid,nodev,noexec,size=64m,uid=${SERVICE_UID},gid=${SERVICE_GID},mode=0700" \
            --tmpfs "/app/output:rw,nosuid,nodev,noexec,size=64m,uid=${SERVICE_UID},gid=${SERVICE_GID},mode=0700" \
            --tmpfs /app/configs/pricing-state:rw,nosuid,nodev,noexec,size=64m,uid=${SERVICE_UID},gid=${SERVICE_GID},mode=0700 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m,uid=${SERVICE_UID},gid=${SERVICE_GID},mode=0700 \
            --env "SLICE_SERVICE_API_KEY=$inert_slice_service_key" \
            --env "SLICE_SERVICE_API_KEY_PREVIOUS=i5-validation-slice-previous-260723-a2" \
            --env "PRICING_API_KEY=i5-validation-pricing-active-260723-b1" \
            --env "PRICING_API_KEY_PREVIOUS=i5-validation-pricing-previous-260723-b2" \
            --env "ARTIFACT_API_KEY=i5-validation-artifact-active-260723-c1" \
            --env "ARTIFACT_API_KEY_PREVIOUS=i5-validation-artifact-previous-260723-c2" \
            --env "OPERATIONS_API_KEY=i5-validation-operations-active-260723-d1" \
            --env "OPERATIONS_API_KEY_PREVIOUS=i5-validation-operations-previous-260723-d2" \
            --env "EXPECTED_SERVICE_UID=$SERVICE_UID" \
            --env "EXPECTED_SERVICE_GID=$SERVICE_GID" \
            --env "EXPECTED_PIDS_LIMIT=512" \
            --env "EXPECTED_MEMORY_BYTES=4294967296" \
            --env "EXPECTED_CPU_LIMIT=2.0" \
            --env "EXPECTED_LOG_MAX_SIZE=20m" \
            --env "EXPECTED_LOG_MAX_FILES=5" \
            --env "EXPECTED_STOP_GRACE_PERIOD=30s" \
            --label io.s3a.validation-only=true \
            --label "io.s3a.expected-image-id=$EXPECTED_IMAGE_ID" \
            "$IMAGE_REF"

          container_pid="$(docker inspect --format '{{.State.Pid}}' "$CONTAINER_NAME")"
          if [[ ! "$container_pid" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=I2 runtime identity::runtime_kernel_pid_failure"
            exit 2
          fi
          kernel_identity="$(/usr/bin/ps -o uid=,gid= -p "$container_pid")"
          if [[ ! "$kernel_identity" =~ ^[[:space:]]*([0-9]+)[[:space:]]+([0-9]+)[[:space:]]*$ ]]; then
            echo "::error title=I2 runtime identity::runtime_kernel_identity_shape_failure"
            exit 2
          fi
          kernel_uid="${BASH_REMATCH[1]}"
          kernel_gid="${BASH_REMATCH[2]}"
          if [ "$kernel_uid" != "$SERVICE_UID" ] || [ "$kernel_gid" != "$SERVICE_GID" ] || \
             [ "$kernel_uid" = "0" ] || [ "$kernel_gid" = "0" ]; then
            echo "::error title=I2 runtime identity::runtime_kernel_identity_mismatch"
            exit 2
          fi
          {
            echo "configured_user=$CONFIGURED_USER"
            echo "service_uid=$SERVICE_UID"
            echo "service_gid=$SERVICE_GID"
            echo "kernel_uid=$kernel_uid"
            echo "kernel_gid=$kernel_gid"
          } >> "$EVIDENCE_DIR/image-identity.txt"

      - name: Run bounded isolated Orca CLI and synthetic slice smoke
        id: orca_cli_smoke
        if: ${{ steps.runtime_identity.outcome == 'success' }}
        continue-on-error: true
        env:
          EXPECTED_IMAGE_ID: ${{ steps.image_identity.outputs.image_id }}
          SERVICE_UID: ${{ steps.runtime_identity.outputs.uid }}
          SERVICE_GID: ${{ steps.runtime_identity.outputs.gid }}
        shell: bash
        run: |
          set -euo pipefail
          if ! node scripts/i2-orca-runtime-smoke.js; then
            echo "classification=orca_cli_smoke_failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          {
            echo "### Orca runtime smoke"
            echo
            echo "The exact non-root image passed bounded offline CLI help and customer-free synthetic cube slicing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the bounded liveness-only health check
        env:
          EXPECTED_IMAGE_ID: ${{ steps.image_identity.outputs.image_id }}
          SERVICE_UID: ${{ steps.runtime_identity.outputs.uid }}
          SERVICE_GID: ${{ steps.runtime_identity.outputs.gid }}
        id: smoke_gate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            running="$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$CONTAINER_NAME")"
            if [ "$running" = "true" ] && [ "$health" = "healthy" ]; then
              node scripts/i4-image-runtime-envelope.js
              {
                echo "### Image runtime smoke gate"
                echo
                echo "The existing Docker HEALTHCHECK reached \`healthy\`."
                echo "This is bounded startup/liveness evidence only, not production readiness."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "classification=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$running" != "true" ] || [ "$health" = "unhealthy" ] || [ "$health" = "missing" ]; then
              echo "classification=runtime_liveness_failure" >> "$GITHUB_OUTPUT"
              echo "Container failed its liveness-only smoke gate (running=$running, health=$health)." >&2
              exit 1
            fi
            sleep 2
          done

          echo "classification=runtime_liveness_failure" >> "$GITHUB_OUTPUT"
          echo "Container did not become healthy within the 240-second bound." >&2
          exit 1

      - name: Prove intended private ingress and API/native egress denial fail closed
        id: topology_gate
        if: ${{ steps.runtime_identity.outcome == 'success' }}
        continue-on-error: true
        env:
          EXPECTED_IMAGE_ID: ${{ steps.image_identity.outputs.image_id }}
          SERVICE_UID: ${{ steps.runtime_identity.outputs.uid }}
          SERVICE_GID: ${{ steps.runtime_identity.outputs.gid }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/i5-topology-runtime-gate.js

      - name: Capture bounded allowlisted runtime diagnostics
        id: runtime_diagnostics
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          SMOKE_OUTCOME: ${{ steps.smoke_gate.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_path="$EVIDENCE_DIR/runtime-diagnostics.json"
          if [ "$EVIDENCE_DIR" != "$RUNNER_TEMP/$EVIDENCE_SUBDIR" ] || [ -L "$EVIDENCE_DIR" ] || \
             [ ! -d "$EVIDENCE_DIR" ] || [ -e "$diagnostic_path" ] || [ -L "$diagnostic_path" ]; then
            echo "The runtime diagnostic path is outside its exact run-scoped boundary." >&2
            exit 2
          fi

          running=null
          exit_code=null
          oom_killed=null
          engine_error='""'
          started_at='""'
          finished_at='""'
          health_status='"missing"'
          health_log='[]'
          container_log=''
          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            running="$(docker inspect --format '{{json .State.Running}}' "$CONTAINER_NAME")"
            exit_code="$(docker inspect --format '{{json .State.ExitCode}}' "$CONTAINER_NAME")"
            oom_killed="$(docker inspect --format '{{json .State.OOMKilled}}' "$CONTAINER_NAME")"
            set +o pipefail
            engine_error="$(docker inspect --format '{{json .State.Error}}' "$CONTAINER_NAME" | head -c 8192)"
            started_at="$(docker inspect --format '{{json .State.StartedAt}}' "$CONTAINER_NAME")"
            finished_at="$(docker inspect --format '{{json .State.FinishedAt}}' "$CONTAINER_NAME")"
            health_status="$(docker inspect --format '{{if .State.Health}}{{json .State.Health.Status}}{{else}}"missing"{{end}}' "$CONTAINER_NAME")"
            health_log="$(docker inspect --format '{{if .State.Health}}{{json .State.Health.Log}}{{else}}[]{{end}}' "$CONTAINER_NAME" | head -c 32768)"
            container_log="$(docker logs --tail 200 "$CONTAINER_NAME" 2>&1 | head -c 20480)"
            set -o pipefail
          fi
          export DIAG_RUNNING="$running" DIAG_EXIT_CODE="$exit_code" DIAG_OOM_KILLED="$oom_killed"
          export DIAG_ENGINE_ERROR="$engine_error" DIAG_STARTED_AT="$started_at" DIAG_FINISHED_AT="$finished_at"
          export DIAG_HEALTH_STATUS="$health_status" DIAG_HEALTH_LOG="$health_log" DIAG_CONTAINER_LOG="$container_log"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root = path.resolve(process.env.RUNNER_TEMP, process.env.EVIDENCE_SUBDIR);
          if (process.env.EVIDENCE_DIR !== root || fs.realpathSync(root) !== root) process.exit(2);
          const parse = (name, fallback) => {
            try { return JSON.parse(process.env[name]); } catch { return fallback; }
          };
          const clip = (value, limit) => String(value || '').slice(0, limit);
          const rawHealthLog = parse('DIAG_HEALTH_LOG', []);
          const healthLog = Array.isArray(rawHealthLog) ? rawHealthLog.slice(-8).map((entry) => ({
            start: clip(entry?.Start, 80),
            end: clip(entry?.End, 80),
            exitCode: Number.isSafeInteger(entry?.ExitCode) ? entry.ExitCode : null,
            output: clip(entry?.Output, 2048)
          })) : [];
          const diagnostic = {
            running: parse('DIAG_RUNNING', null),
            exitCode: parse('DIAG_EXIT_CODE', null),
            oomKilled: parse('DIAG_OOM_KILLED', null),
            engineError: clip(parse('DIAG_ENGINE_ERROR', ''), 4096),
            startedAt: clip(parse('DIAG_STARTED_AT', ''), 80),
            finishedAt: clip(parse('DIAG_FINISHED_AT', ''), 80),
            healthStatus: clip(parse('DIAG_HEALTH_STATUS', 'missing'), 32),
            healthLog,
            containerLog: clip(process.env.DIAG_CONTAINER_LOG, 20480)
          };
          const target = path.join(root, 'runtime-diagnostics.json');
          fs.writeFileSync(target, `${JSON.stringify(diagnostic, null, 2)}\n`, { flag: 'wx', mode: 0o600 });
          const stat = fs.lstatSync(target);
          if (!stat.isFile() || stat.isSymbolicLink() || stat.size <= 0 || stat.size > 96 * 1024
              || path.dirname(fs.realpathSync(target)) !== root) process.exit(2);
          NODE
          echo "classification=captured" >> "$GITHUB_OUTPUT"
          if [ "$SMOKE_OUTCOME" = "success" ]; then
            summary_classification=runtime_liveness_success
          else
            summary_classification=runtime_liveness_failure
          fi
          printf '\n### Bounded runtime diagnostics\n\nClassification: `%s`. Raw output is retained only in the bounded artifact.\n' \
            "$summary_classification" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate SPDX JSON SBOM from the exact local image
        id: sbom
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.candidate.outputs.image_ref }}
          format: spdx-json
          output-file: ${{ runner.temp }}/${{ env.EVIDENCE_SUBDIR }}/sbom.spdx.json
          config: ${{ runner.temp }}/${{ env.EVIDENCE_SUBDIR }}/syft.yaml
          syft-version: v1.44.0
          github-token: ''
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Require a non-empty valid SPDX JSON result
        id: sbom_gate
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          echo "classification=sbom_infrastructure_failure" >> "$GITHUB_OUTPUT"
          if [ "$SBOM_OUTCOME" != "success" ]; then
            echo "::error title=SBOM infrastructure failure::The SBOM action did not complete successfully."
            exit 2
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const resultPath = `${process.env.EVIDENCE_DIR}/sbom.spdx.json`;
          let stat;
          let report;
          try {
            stat = fs.lstatSync(resultPath);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size <= 0 || stat.size > 100 * 1024 * 1024
                || path.dirname(fs.realpathSync(resultPath)) !== fs.realpathSync(process.env.EVIDENCE_DIR)) {
              throw new Error('result is not a bounded contained regular file');
            }
            report = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          } catch (error) {
            console.error(`::error title=SBOM infrastructure failure::Invalid SPDX JSON: ${error.message}`);
            process.exit(2);
          }

          if (typeof report.spdxVersion !== 'string' || typeof report.SPDXID !== 'string' || !Array.isArray(report.packages)) {
            console.error('::error title=SBOM infrastructure failure::SPDX JSON lacks required document structure.');
            process.exit(2);
          }
          NODE
          echo "classification=success" >> "$GITHUB_OUTPUT"

      - name: Scan the exact local image with Grype
        id: scan
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ steps.candidate.outputs.image_ref }}
          fail-build: false
          output-format: json
          output-file: ${{ runner.temp }}/${{ env.EVIDENCE_SUBDIR }}/grype.json
          config: ${{ runner.temp }}/${{ env.EVIDENCE_SUBDIR }}/grype.yaml
          severity-cutoff: high
          only-fixed: false
          grype-version: v0.110.0
          cache-db: false

      - name: Render bounded HIGH and CRITICAL vulnerability triage
        id: vulnerability_triage
        if: ${{ always() && steps.build.outcome == 'success' }}
        env:
          GRYPE_RESULT_PATH: ${{ runner.temp }}/${{ env.EVIDENCE_SUBDIR }}/grype.json
        shell: bash
        run: |
          set -euo pipefail
          echo "classification=triage_parser_failure" >> "$GITHUB_OUTPUT"
          node scripts/render-image-vulnerability-summary.js
          echo "classification=success" >> "$GITHUB_OUTPUT"

      - name: Distinguish scanner failure from high or critical findings
        id: scan_gate
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          echo "classification=scanner_infrastructure_failure" >> "$GITHUB_OUTPUT"
          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "::error title=Scanner infrastructure failure::The Grype action did not complete successfully."
            exit 2
          fi
          if [ ! -s "$EVIDENCE_DIR/grype.json" ]; then
            echo "::error title=Scanner infrastructure failure::The Grype JSON result is missing or empty."
            exit 2
          fi

          node <<'NODE'
          const fs = require('node:fs');

          const resultPath = `${process.env.EVIDENCE_DIR}/grype.json`;
          let report;
          try {
            report = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          } catch (error) {
            console.error(`::error title=Scanner infrastructure failure::Invalid Grype JSON: ${error.message}`);
            process.exit(2);
          }

          if (!Array.isArray(report.matches)) {
            console.error('::error title=Scanner infrastructure failure::Grype JSON has no matches array.');
            process.exit(2);
          }

          const counts = { high: 0, critical: 0 };
          for (const match of report.matches) {
            const severity = String(match?.vulnerability?.severity || '').toLowerCase();
            if (Object.hasOwn(counts, severity)) counts[severity] += 1;
          }

          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `\n### Exact-image vulnerability gate\n\nHigh findings: ${counts.high}\nCritical findings: ${counts.critical}\n`
          );

          if (counts.high > 0 || counts.critical > 0) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'classification=vulnerability_gate_failure\n');
            console.error(`High/critical vulnerability gate failed: high=${counts.high}, critical=${counts.critical}.`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'classification=success\n');
          NODE

      - name: Require exact regular evidence files before upload
        id: artifact_boundary
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          CONFIGURED_USER: ${{ steps.runtime_identity.outputs.configured_user }}
          SERVICE_UID: ${{ steps.runtime_identity.outputs.uid }}
          SERVICE_GID: ${{ steps.runtime_identity.outputs.gid }}
        shell: bash
        run: |
          set -euo pipefail
          echo "classification=evidence_boundary_failure" >> "$GITHUB_OUTPUT"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {
            validateTopologyEvidence
          } = require('./scripts/i5-topology-evidence-contract');
          const failBoundary = (code) => {
            if (!/^[a-z0-9_]{1,80}$/.test(code)) code = 'unclassified_boundary_failure';
            console.error(`::error title=I2 evidence boundary::${code}`);
            process.exit(2);
          };

          const expectedRoot = path.resolve(process.env.RUNNER_TEMP, process.env.EVIDENCE_SUBDIR);
          if (process.env.EVIDENCE_DIR !== expectedRoot) {
            failBoundary('evidence_root_mismatch');
          }

          let actualRoot;
          try {
            const rootStat = fs.lstatSync(expectedRoot);
            if (!rootStat.isDirectory() || rootStat.isSymbolicLink()) throw new Error('root is not a regular directory');
            actualRoot = fs.realpathSync(expectedRoot);
          } catch {
            failBoundary('evidence_root_invalid');
          }

          if (actualRoot !== expectedRoot) {
            failBoundary('evidence_root_realpath_mismatch');
          }

          const limits = {
            'image-identity.txt': 16 * 1024,
            'runtime-diagnostics.json': 96 * 1024,
            'topology-evidence.json': 16 * 1024,
            'sbom.spdx.json': 100 * 1024 * 1024,
            'grype.json': 100 * 1024 * 1024
          };
          for (const [name, limit] of Object.entries(limits)) {
            const filePath = path.join(actualRoot, name);
            let stat;
            try {
              stat = fs.lstatSync(filePath);
            } catch {
              failBoundary(`evidence_file_missing_${name.replace(/[^a-z0-9]/g, '_')}`);
            }
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size <= 0 || stat.size > limit) {
              failBoundary(`evidence_file_invalid_${name.replace(/[^a-z0-9]/g, '_')}`);
            }
            if (path.dirname(fs.realpathSync(filePath)) !== actualRoot) {
              failBoundary(`evidence_file_realpath_${name.replace(/[^a-z0-9]/g, '_')}`);
            }
          }

          let sbom;
          let scan;
          let diagnostic;
          let topology;
          try {
            sbom = JSON.parse(fs.readFileSync(path.join(actualRoot, 'sbom.spdx.json'), 'utf8'));
            scan = JSON.parse(fs.readFileSync(path.join(actualRoot, 'grype.json'), 'utf8'));
            diagnostic = JSON.parse(fs.readFileSync(path.join(actualRoot, 'runtime-diagnostics.json'), 'utf8'));
            topology = JSON.parse(fs.readFileSync(path.join(actualRoot, 'topology-evidence.json'), 'utf8'));
          } catch {
            failBoundary('evidence_json_parse_failure');
          }
          if (typeof sbom.spdxVersion !== 'string' || typeof sbom.SPDXID !== 'string' || !Array.isArray(sbom.packages)) {
            failBoundary('sbom_schema_failure');
          }
          if (!Array.isArray(scan.matches)) {
            failBoundary('grype_schema_failure');
          }
          const diagnosticKeys = [
            'running', 'exitCode', 'oomKilled', 'engineError', 'startedAt', 'finishedAt',
            'healthStatus', 'healthLog', 'containerLog'
          ];
          if (!diagnostic || typeof diagnostic !== 'object' || Array.isArray(diagnostic)
              || JSON.stringify(Object.keys(diagnostic).sort()) !== JSON.stringify([...diagnosticKeys].sort())
              || ![true, false, null].includes(diagnostic.running)
              || !(diagnostic.exitCode === null || Number.isSafeInteger(diagnostic.exitCode))
              || ![true, false, null].includes(diagnostic.oomKilled)
              || typeof diagnostic.engineError !== 'string' || diagnostic.engineError.length > 4096
              || typeof diagnostic.startedAt !== 'string' || diagnostic.startedAt.length > 80
              || typeof diagnostic.finishedAt !== 'string' || diagnostic.finishedAt.length > 80
              || typeof diagnostic.healthStatus !== 'string' || diagnostic.healthStatus.length > 32
              || typeof diagnostic.containerLog !== 'string' || diagnostic.containerLog.length > 20480
              || !Array.isArray(diagnostic.healthLog) || diagnostic.healthLog.length > 8
              || diagnostic.healthLog.some((entry) => !entry || typeof entry !== 'object' || Array.isArray(entry)
                || JSON.stringify(Object.keys(entry).sort()) !== JSON.stringify(['end', 'exitCode', 'output', 'start'])
                || typeof entry.start !== 'string' || entry.start.length > 80
                || typeof entry.end !== 'string' || entry.end.length > 80
                || !(entry.exitCode === null || Number.isSafeInteger(entry.exitCode))
                || typeof entry.output !== 'string' || entry.output.length > 2048)) {
            failBoundary('runtime_diagnostic_schema_failure');
          }
          const topologyEvidenceError = validateTopologyEvidence(topology);
          if (topologyEvidenceError) {
            failBoundary(topologyEvidenceError);
          }

          const identityLines = fs.readFileSync(path.join(actualRoot, 'image-identity.txt'), 'utf8')
            .trimEnd()
            .split('\n');
          const identity = Object.fromEntries(identityLines.map((line) => {
            const separator = line.indexOf('=');
            return separator > 0 ? [line.slice(0, separator), line.slice(separator + 1)] : ['', ''];
          }));
          const expectedKeys = [
            'candidate_sha', 'local_image_ref', 'local_image_id', 'build_action_image_id',
            'identity_scope', 'registry_digest', 'signature', 'attestation',
            'configured_user', 'service_uid', 'service_gid', 'kernel_uid', 'kernel_gid'
          ];
          if (identityLines.length !== expectedKeys.length || expectedKeys.some((key) => !(key in identity))) {
            failBoundary('image_identity_keys_failure');
          }
          if (identity.candidate_sha !== process.env.CANDIDATE_SHA || identity.local_image_ref !== process.env.IMAGE_REF ||
              !/^sha256:[0-9a-f]{64}$/.test(identity.local_image_id) ||
              (identity.build_action_image_id && identity.build_action_image_id !== identity.local_image_id) ||
              identity.identity_scope !== 'local-loaded-image-only' ||
              identity.registry_digest !== 'not_applicable_no_push' || identity.signature !== 'not_created' ||
              identity.attestation !== 'not_created' || identity.configured_user !== 'slicer' ||
              !/^[1-9][0-9]*$/.test(identity.service_uid) || !/^[1-9][0-9]*$/.test(identity.service_gid) ||
              identity.kernel_uid !== identity.service_uid || identity.kernel_gid !== identity.service_gid ||
              identity.configured_user !== process.env.CONFIGURED_USER ||
              identity.service_uid !== process.env.SERVICE_UID || identity.service_gid !== process.env.SERVICE_GID) {
            failBoundary('image_identity_contract_failure');
          }
          NODE
          echo "classification=success" >> "$GITHUB_OUTPUT"

      - name: Upload bounded image-validation evidence only
        id: evidence_upload
        if: ${{ always() && steps.artifact_boundary.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: s3a-image-evidence-${{ steps.candidate.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ env.EVIDENCE_SUBDIR }}/image-identity.txt
            ${{ runner.temp }}/${{ env.EVIDENCE_SUBDIR }}/runtime-diagnostics.json
            ${{ runner.temp }}/${{ env.EVIDENCE_SUBDIR }}/topology-evidence.json
            ${{ runner.temp }}/${{ env.EVIDENCE_SUBDIR }}/sbom.spdx.json
            ${{ runner.temp }}/${{ env.EVIDENCE_SUBDIR }}/grype.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false

      - name: Remove only this run's exact containers, image, and evidence
        id: exact_cleanup
        if: ${{ always() }}
        continue-on-error: true
        env:
          EXPECTED_IMAGE_ID: ${{ steps.image_identity.outputs.image_id }}
        shell: bash
        run: |
          set -u
          cleanup_status=0
          cleanup_error() {
            echo "::error title=I2 exact cleanup::$1"
            cleanup_status=1
          }
          exact_container_record() {
            local exact_reference="$1" inspect_output inspect_error inspect_status
            inspect_output="$(docker container inspect --format \
              '{{.Id}}|{{.Image}}|{{index .Config.Labels "io.s3a.validation-only"}}|{{index .Config.Labels "io.s3a.expected-image-id"}}' \
              "$exact_reference" 2>/dev/null)"
            inspect_status=$?
            if [ "$inspect_status" -eq 0 ]; then
              printf '%s\n' "$inspect_output"
              return 0
            fi
            case "$inspect_output" in
              ""|"[]") ;;
              *) return 2 ;;
            esac
            inspect_error="$(docker container inspect "$exact_reference" 2>&1 >/dev/null)"
            inspect_status=$?
            if [ "$inspect_status" -ne 1 ]; then
              return 2
            fi
            case "$inspect_error" in
              "Error: No such object: $exact_reference"|"Error: No such container: $exact_reference"|\
              "Error response from daemon: No such container: $exact_reference") return 1 ;;
              *) return 2 ;;
            esac
          }
          exact_image_present() {
            local exact_ref="$1" inspect_error inspect_status
            inspect_error="$(docker image inspect "$exact_ref" 2>&1 >/dev/null)"
            inspect_status=$?
            if [ "$inspect_status" -eq 0 ]; then return 0; fi
            case "$inspect_error" in
              "Error: No such object: $exact_ref"|"Error: No such image: $exact_ref"|\
              "Error response from daemon: No such image: $exact_ref") return 1 ;;
              *) return 2 ;;
            esac
          }
          remove_exact_network() {
            local network_id="$1"
            docker network rm "$network_id"
          }
          network_reference_present() {
            docker network inspect "$1" >/dev/null 2>&1
          }
          for exact_container in "$I2_UID_PROBE_NAME" "$I2_GID_PROBE_NAME" \
              "$I2_ORCA_PROBE_NAME" "$I5_TOPOLOGY_PROBE_NAME" "$CONTAINER_NAME" \
              "$I5_EGRESS_SENTINEL_NAME"; do
            if container_record="$(exact_container_record "$exact_container")"; then
              container_state=0
            else
              container_state=$?
            fi
            if [ "$container_state" -eq 0 ]; then
              IFS='|' read -r container_id container_image validation_label expected_label <<< "$container_record"
              if [[ ! "$container_id" =~ ^[0-9a-f]{64}$ ]] || \
                 [ "$container_image" != "$EXPECTED_IMAGE_ID" ] || \
                 [ "$validation_label" != "true" ] || [ "$expected_label" != "$EXPECTED_IMAGE_ID" ]; then
                cleanup_error container_ownership_failure
                continue
              fi
              docker container rm --force "$container_id" || cleanup_error container_remove_failure
            elif [ "$container_state" -ne 1 ]; then
              cleanup_error container_inspect_failure
            fi
            if [ "$container_state" -eq 0 ] && exact_container_record "$container_id" >/dev/null; then
              container_id_state=0
            else
              container_id_state=$?
            fi
            if [ "$container_state" -eq 0 ] && [ "$container_id_state" -ne 1 ]; then
              cleanup_error container_cleanup_verification_failure
            fi
            if exact_container_record "$exact_container" >/dev/null; then
              container_state=0
            else
              container_state=$?
            fi
            if [ "$container_state" -ne 1 ]; then
              cleanup_error container_cleanup_verification_failure
            fi
          done
          invalid_network_labels() {
            local validation_label="$1" expected_label="$2"
            [ "$validation_label" != "true" ] || [ "$expected_label" != "$EXPECTED_IMAGE_ID" ]
          }
          if docker network inspect "$I5_PRIVATE_NETWORK_NAME" >/dev/null 2>&1; then
            network_record="$(docker network inspect --format \
              '{{.Id}}|{{index .Labels "io.s3a.validation-only"}}|{{index .Labels "io.s3a.expected-image-id"}}|{{.Internal}}' \
              "$I5_PRIVATE_NETWORK_NAME")" || cleanup_error network_inspect_failure
            IFS='|' read -r network_id validation_label expected_label internal_flag <<< "$network_record"
            if [[ ! "$network_id" =~ ^[0-9a-f]{64}$ ]] || \
               invalid_network_labels "$validation_label" "$expected_label" || \
               [ "$internal_flag" != "true" ]; then
              cleanup_error network_ownership_failure
            else
              remove_exact_network "$network_id" || cleanup_error network_remove_failure
            fi
          fi
          private_network_id="${network_id:-}"
          if [ -n "$private_network_id" ] && docker network inspect "$private_network_id" >/dev/null 2>&1; then
            cleanup_error network_cleanup_verification_failure
          fi
          if docker network inspect "$I5_PRIVATE_NETWORK_NAME" >/dev/null 2>&1; then
            cleanup_error network_cleanup_verification_failure
          fi
          network_id=
          if docker network inspect "$I5_SENTINEL_NETWORK_NAME" >/dev/null 2>&1; then
            network_record="$(docker network inspect --format \
              '{{.Id}}|{{index .Labels "io.s3a.validation-only"}}|{{index .Labels "io.s3a.expected-image-id"}}|{{.Internal}}' \
              "$I5_SENTINEL_NETWORK_NAME")" || cleanup_error network_inspect_failure
            IFS='|' read -r network_id validation_label expected_label internal_flag <<< "$network_record"
            if [[ ! "$network_id" =~ ^[0-9a-f]{64}$ ]] || \
               invalid_network_labels "$validation_label" "$expected_label" || \
               [ "$internal_flag" != "false" ]; then
              cleanup_error network_ownership_failure
            else
              remove_exact_network "$network_id" || cleanup_error network_remove_failure
            fi
          fi
          sentinel_network_id="${network_id:-}"
          if [ -n "$sentinel_network_id" ] && docker network inspect "$sentinel_network_id" >/dev/null 2>&1; then
            cleanup_error network_cleanup_verification_failure
          fi
          if network_reference_present "$I5_SENTINEL_NETWORK_NAME"; then
            cleanup_error network_cleanup_verification_failure
          fi
          if [ -n "${IMAGE_REF:-}" ]; then
            if exact_image_present "$IMAGE_REF"; then
              image_state=0
            else
              image_state=$?
            fi
            if [ "$image_state" -eq 0 ]; then
              docker image rm --force "$IMAGE_REF" || cleanup_error image_remove_failure
            elif [ "$image_state" -ne 1 ]; then
              cleanup_error image_inspect_failure
            fi
            if exact_image_present "$IMAGE_REF"; then
              image_state=0
            else
              image_state=$?
            fi
            if [ "$image_state" -ne 1 ]; then
              cleanup_error image_cleanup_verification_failure
            fi
          fi
          expected_evidence_dir="$RUNNER_TEMP/$EVIDENCE_SUBDIR"
          if { [ -n "${EVIDENCE_DIR:-}" ] && [ "$EVIDENCE_DIR" != "$expected_evidence_dir" ]; } || \
             [ -L "$expected_evidence_dir" ]; then
            cleanup_error evidence_directory_boundary_failure
          elif [ -d "$expected_evidence_dir" ]; then
              for evidence_name in image-identity.txt runtime-diagnostics.json \
                  topology-evidence.json sbom.spdx.json grype.json syft.yaml grype.yaml; do
                evidence_path="$expected_evidence_dir/$evidence_name"
                if [ -f "$evidence_path" ] && [ ! -L "$evidence_path" ]; then
                  rm -- "$evidence_path" || cleanup_error evidence_file_remove_failure
                elif [ -e "$evidence_path" ] || [ -L "$evidence_path" ]; then
                  cleanup_error evidence_file_type_failure
                fi
              done
              rmdir -- "$expected_evidence_dir" || cleanup_error evidence_directory_remove_failure
          elif [ -e "$expected_evidence_dir" ]; then
            cleanup_error evidence_directory_type_failure
          fi
          if [ "$cleanup_status" -ne 0 ]; then
            echo "classification=cleanup_failure" >> "$GITHUB_OUTPUT"
            echo "Exact-resource cleanup failed." >&2
            exit "$cleanup_status"
          fi
          echo "classification=success" >> "$GITHUB_OUTPUT"
          echo "Removed only this run's exact containers, private and sentinel networks, image tag, five evidence files, and scanner configs when present; no prune was run." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce all independent image validation gates fail-closed
        id: final_enforcement
        if: ${{ always() }}
        env:
          SMOKE_OUTCOME: ${{ steps.smoke_gate.outcome }}
          SMOKE_CLASSIFICATION: ${{ steps.smoke_gate.outputs.classification }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          SBOM_GATE_OUTCOME: ${{ steps.sbom_gate.outcome }}
          SBOM_CLASSIFICATION: ${{ steps.sbom_gate.outputs.classification }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SCAN_GATE_OUTCOME: ${{ steps.scan_gate.outcome }}
          SCAN_CLASSIFICATION: ${{ steps.scan_gate.outputs.classification }}
          TRIAGE_OUTCOME: ${{ steps.vulnerability_triage.outcome }}
          TRIAGE_CLASSIFICATION: ${{ steps.vulnerability_triage.outputs.classification }}
          DIAGNOSTIC_OUTCOME: ${{ steps.runtime_diagnostics.outcome }}
          RUNTIME_IDENTITY_OUTCOME: ${{ steps.runtime_identity.outcome }}
          RUNTIME_IDENTITY_CLASSIFICATION: ${{ steps.runtime_identity.outputs.classification }}
          ORCA_CLI_SMOKE_OUTCOME: ${{ steps.orca_cli_smoke.outcome }}
          ORCA_CLI_SMOKE_CLASSIFICATION: ${{ steps.orca_cli_smoke.outputs.classification }}
          TOPOLOGY_OUTCOME: ${{ steps.topology_gate.outcome }}
          TOPOLOGY_CLASSIFICATION: ${{ steps.topology_gate.outputs.classification }}
          TOPOLOGY_CONTRACT_REASON: ${{ steps.topology_gate.outputs.contract_reason }}
          TOPOLOGY_SENTINEL_OPERATIONAL: ${{ steps.topology_gate.outputs.sentinel_operational }}
          ARTIFACT_BOUNDARY_OUTCOME: ${{ steps.artifact_boundary.outcome }}
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          CLEANUP_OUTCOME: ${{ steps.exact_cleanup.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const failures = [];
          if (process.env.SMOKE_OUTCOME !== 'success' || process.env.SMOKE_CLASSIFICATION !== 'success') {
            failures.push('runtime_liveness_failure');
          }
          if (process.env.SBOM_OUTCOME !== 'success' || process.env.SBOM_GATE_OUTCOME !== 'success'
              || process.env.SBOM_CLASSIFICATION !== 'success') {
            failures.push('sbom_infrastructure_failure');
          }
          if (process.env.SCAN_CLASSIFICATION === 'vulnerability_gate_failure') {
            failures.push('vulnerability_gate_failure');
          } else if (process.env.SCAN_OUTCOME !== 'success' || process.env.SCAN_GATE_OUTCOME !== 'success'
              || process.env.SCAN_CLASSIFICATION !== 'success') {
            failures.push('scanner_infrastructure_failure');
          }
          if (process.env.TRIAGE_OUTCOME !== 'success' || process.env.TRIAGE_CLASSIFICATION !== 'success') {
            failures.push('triage_parser_failure');
          }
          if (process.env.RUNTIME_IDENTITY_OUTCOME !== 'success'
              || process.env.RUNTIME_IDENTITY_CLASSIFICATION !== 'success') {
            failures.push('runtime_identity_failure');
          }
          if (process.env.ORCA_CLI_SMOKE_OUTCOME !== 'success'
              || process.env.ORCA_CLI_SMOKE_CLASSIFICATION !== 'success') {
            failures.push('orca_cli_smoke_failure');
          }
          if (process.env.TOPOLOGY_OUTCOME !== 'success'
              || process.env.TOPOLOGY_CLASSIFICATION !== 'success') {
            const allowedBlockedReason = (
              process.env.TOPOLOGY_CLASSIFICATION === 'BLOCKED_S4_EGRESS_CAPABILITY'
              && [
                'loopback_ingress_unavailable', 'authenticated_readiness_unavailable'
              ].includes(process.env.TOPOLOGY_CONTRACT_REASON)
            ) || (
              process.env.TOPOLOGY_CLASSIFICATION === 'BLOCKED_S4_HOSTED_RUNTIME_CAPABILITY'
              && [
                'docker_command_unavailable', 'private_runtime_probe_unavailable'
              ].includes(process.env.TOPOLOGY_CONTRACT_REASON)
            );
            failures.push(allowedBlockedReason
              ? process.env.TOPOLOGY_CLASSIFICATION : 'topology_gate_failure');
          } else if (process.env.TOPOLOGY_CONTRACT_REASON !== 'success') {
            failures.push('topology_gate_failure');
          }
          if (Object.hasOwn(process.env, 'TOPOLOGY_SENTINEL_OPERATIONAL')
              && process.env.TOPOLOGY_SENTINEL_OPERATIONAL !== 'true') {
            failures.push('topology_sentinel_failure');
          }
          if (process.env.DIAGNOSTIC_OUTCOME !== 'success'
              || process.env.ARTIFACT_BOUNDARY_OUTCOME !== 'success'
              || process.env.EVIDENCE_UPLOAD_OUTCOME !== 'success') {
            failures.push('evidence_boundary_failure');
          }
          if (process.env.CLEANUP_OUTCOME !== 'success') {
            failures.push('cleanup_failure');
          }

          const classifications = [...new Set(failures)];
          const summary = classifications.length === 0
            ? '\n### Final image validation enforcement\n\nAll independent runtime identity, Orca CLI/synthetic slice, liveness, live-sentinel/private-ingress/API-native-egress, SBOM, scanner, vulnerability, evidence, and cleanup gates passed.\n'
            : `\n### Final image validation enforcement\n\nFail-closed classifications: ${classifications.map((value) => `\`${value}\``).join(', ')}.\n`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          if (classifications.length > 0) {
            console.error(`::error title=I2 final enforcement::${classifications.join(',')}`);
            console.error(`Image validation failed closed: ${classifications.join(',')}`);
            process.exit(1);
          }
          NODE
