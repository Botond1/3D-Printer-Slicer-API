name: Validation CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax, tests, audit, and repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select exact npm 10.9.8
        shell: bash
        run: |
          npm install --global npm@10.9.8 --ignore-scripts --no-audit --no-fund
          actual_npm_version="$(npm --version)"
          if [ "$actual_npm_version" != "10.9.8" ]; then
            echo "Expected npm 10.9.8, got $actual_npm_version." >&2
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node.js dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate tracked source syntax
        run: npm run check:syntax

      - name: Run deterministic unit tests
        run: npm test

      - name: Audit production dependencies at moderate threshold
        run: npm audit --omit=dev --audit-level=moderate

      - name: Guard tracked repository content
        run: npm run check:repository-safety
