name: Debug DNS (temporary)
on:
  pull_request:
    paths:
      - .github/workflows/debug-dns.yml
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Which names fail
        run: |
          set +e
          for h in archive.ubuntu.com security.ubuntu.com azure.archive.ubuntu.com ubuntu.com deb.nodesource.com pypi.org files.pythonhosted.org github.com registry.npmjs.org; do
            echo "host getent $h: $(getent ahostsv4 $h | head -1 | cut -d' ' -f1) exit=$?"
          done
          for r in 1.1.1.1 8.8.8.8 168.63.129.16; do
            for h in archive.ubuntu.com security.ubuntu.com; do
              echo "dig @$r $h: $(dig +short +time=3 +tries=1 @$r $h A | tr '\n' ' ') status=$(dig +time=3 +tries=1 @$r $h A | grep -o 'status: [A-Z]*')"
            done
          done
          dig +time=3 +tries=1 @168.63.129.16 archive.ubuntu.com A | tail -12
          dig +time=3 +tries=1 @168.63.129.16 archive.ubuntu.com AAAA | grep -E "status|ANSWER"
      - name: Container with add-host
        run: |
          set +e
          A="$(dig +short +time=3 +tries=1 @1.1.1.1 archive.ubuntu.com A | grep -E '^[0-9.]+$' | head -1)"
          S="$(dig +short +time=3 +tries=1 @1.1.1.1 security.ubuntu.com A | grep -E '^[0-9.]+$' | head -1)"
          echo "resolved $A $S"
          docker run --rm --add-host "archive.ubuntu.com:$A" --add-host "security.ubuntu.com:$S" ubuntu:24.04 sh -c 'apt-get update 2>&1 | tail -4; getent hosts deb.nodesource.com pypi.org; echo "getent exit $?"'
